name: Release

# Builds the sdist and wheel and uploads them with PyPI trusted publishing
# (OIDC; no API tokens are stored anywhere).
#
# - Manual run (Actions tab -> Release -> Run workflow): upload to TestPyPI.
# - Publishing a GitHub release whose tag is v<version>: upload to PyPI.
#
# Runs only in the public repository, so a release can never be built from
# any other copy of the code.

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'sulliv-luke/timesage-survival'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "import glob, re; w = glob.glob('dist/*.whl')[0]; print(re.match(r'dist/timesage_survival-([^-]+)-', w).group(1))")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Install the built wheel into a clean environment and run the fast tests
  # against it, so what is uploaded is what was tested.
  check-wheel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: python -m pip install --upgrade pip
      - run: pip install dist/*.whl "lifelines>=0.27" "matplotlib>=3.7" "pytest>=8.0"
      - name: Fast tests against the installed wheel (not the source tree)
        run: |
          rm -rf src
          python -c "import timesage, sys; assert 'site-packages' in timesage.__file__, timesage.__file__; print(timesage.__version__)"
          pytest -q

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, check-wheel]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/timesage-survival
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: [build, check-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/timesage-survival
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
