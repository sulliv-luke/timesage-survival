[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "timesage-survival"
dynamic = ["version"]
description = "Loss-calibrated, time-indexed global feature attribution (TimeSAGE) for survival models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luke Sullivan" }]
requires-python = ">=3.10"
keywords = ["survival analysis", "feature importance", "shapley", "SAGE", "IPCW", "explainability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
lifelines = ["lifelines>=0.27"]
# Upper bounds: the DeepSurv/DeepHit adapters rely on pycox's predict_surv_df
# running the net in eval() mode without gradients (torchtuples
# Model._predict_func_dl) and on pycox's survival conventions (step function on
# training times; DeepHit mass at cut 0). Contract tests pin these; widen the
# bounds only after they pass on the new releases.
pycox = ["pycox>=0.3,<0.4", "torchtuples>=0.2.2,<0.3", "torch>=2.0"]
plot = ["matplotlib>=3.7"]
# examples/coxph_metabric.py: k-means background (scikit-learn) and the CoxPH model.
examples = ["scikit-learn>=1.3", "lifelines>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.0",
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Repository = "https://github.com/sulliv-luke/timesage-survival"

[tool.hatch.version]
path = "src/timesage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/timesage"]

[tool.hatch.build.targets.sdist]
include = ["src/timesage", "tests", "/README.md", "/CHANGELOG.md", "/CONVENTIONS.md", "/DATA.md", "/LICENSE", "/pyproject.toml"]
exclude = ["tests/parity/out"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["legacy", "scratch", "src/timesage/_vendor/sage.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Docstring rules apply to the package only.
"tests/**" = ["D"]
"examples/**" = ["D"]
"scripts/**" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["timesage"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src/timesage"]

[[tool.mypy.overrides]]
module = ["lifelines.*", "pycox.*", "torchtuples.*", "torch.*", "matplotlib.*", "scipy.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Slow tests (parity, synthetic recovery) are skipped by default; run them
# with `pytest -m slow` (the last -m on the command line wins).
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not slow"]
markers = [
    "slow: parity, characterisation and synthetic-recovery tests (deselected by default)",
    "needs_data: needs METABRIC or other data files not in the repository; runs by default and skips when they are absent (deselect with -m 'not needs_data')",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["timesage"]
branch = true
